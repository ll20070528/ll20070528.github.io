<!DOCTYPE HTML>
<html lang="zh-CN">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <title>科研项目 - 蔺庆海</title>
  <meta name="author" content="蔺庆海 (Qinghai Lin)">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="蔺庆海（Qinghai Lin）主持/参与的科研项目。">
  <meta name="robots" content="index, follow">

  <meta property="og:title" content="科研项目 - 蔺庆海">
  <meta property="og:description" content="蔺庆海（Qinghai Lin）主持/参与的科研项目。">
  <meta property="og:image" content="figures/me.jpg">
  <meta property="og:url" content="https://ll20070528.github.io/projects.html">
  <meta property="og:type" content="profile">

  <link rel="stylesheet" type="text/css" href="stylesheet.css">
  <link rel="stylesheet" type="text/css" href="shared-styles.css">
  <link rel="icon" type="image/png" href="figures/logo.png">

  <style>
    .page-title { font-size: 24px; font-weight: 700; color: #1a1a1a; margin-bottom: 4px; text-align: left; }
    .page-subtitle { font-size: 14px; color: #6b7280; margin-bottom: 24px; }
    .project-list { list-style: none !important; padding-left: 0 !important; }
    .project-item { margin-bottom: 16px; padding: 0 0 14px 0; border-bottom: 1px solid #e5e7eb; }
    .project-item:last-child { border-bottom: none; }
    .project-title { font-size: 15px; font-weight: 600; color: #1a1a1a; margin-bottom: 4px; line-height: 1.6; }
    .project-description { font-size: 14px; color: #6b7280; line-height: 1.6; }
    [data-theme="dark"] .page-title { color: var(--text-color); }
    [data-theme="dark"] .project-title { color: var(--text-color); }
    [data-theme="dark"] .project-item { border-bottom-color: #374151; }
    [data-theme="dark"] .project-description, [data-theme="dark"] .page-subtitle { color: #888; }
  </style>
</head>

<body>
  <div id="site-nav"></div>

  <main id="main-content" class="main-content-wrapper page-shell">
    <h1 class="page-title">科研项目</h1>
    <p class="page-subtitle">主持 / 参与的主要科研项目（含国家自然科学基金、省部级及横向课题）</p>

    <ul id="projects-list" class="project-list">
      <!-- 项目由下方脚本渲染 -->
    </ul>
  </main>

  <div id="site-footer"></div>

  <script src="site-shell.js"></script>
  <script src="utils.js"></script>
  <script src="data.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const list = document.getElementById('projects-list');
      if (list) {
        getAllProjects().forEach((project, i) => {
          const li = document.createElement('li');
          li.className = 'project-item';
          li.innerHTML =
            '<div class="project-title">' + (i + 1) + '. ' + project.title + '</div>' +
            '<div class="project-description">' + project.description + '</div>';
          list.appendChild(li);
        });
      }
      initializeDarkMode();
      initializeBackToTop();
    });
  </script>
</body>

</html>
