  <style>
    .page-title { font-size: 24px; font-weight: 700; color: #1a1a1a; margin-bottom: 24px; text-align: left; }
    .about-section { margin-bottom: 28px; }
    .about-section h2 {
      font-size: 16px; font-weight: 600; color: #1a1a1a; text-transform: uppercase;
      letter-spacing: 0.06em; margin-bottom: 12px; padding-bottom: 4px; border-bottom: 1px solid #e5e7eb;
    }
    .about-section p { color: #374151; line-height: 1.8; }
    .team-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .team-card {
      display: flex; align-items: center; gap: 12px; padding: 14px;
      border: 1px solid #e5e7eb; border-radius: 8px; background: #fff;
    }
    .team-photo {
      width: 56px; height: 56px; border-radius: 50%; object-fit: cover; flex-shrink: 0;
      border: 1px solid #e5e7eb;
    }
    .team-photo-placeholder {
      display: flex; align-items: center; justify-content: center;
      background: #e5e7eb; color: #6b7280; font-size: 20px; font-weight: 600;
    }
    .team-info { min-width: 0; }
    .team-name { font-weight: 600; color: #1a1a1a; }
    .team-name-en { font-weight: 400; color: #9ca3af; font-size: 13px; }
    .team-role { font-size: 13px; color: #6b7280; }
    .team-research { font-size: 13px; color: #374151; }
    .team-links { margin-top: 4px; }
    .team-links a { font-size: 13px; color: var(--primary-color); text-decoration: none; margin-right: 10px; }
    .team-links a:hover { color: var(--secondary-color); }
    .team-empty-note { font-size: 14px; color: #9ca3af; }
    .team-empty-note a { color: var(--primary-color); text-decoration: none; }

    [data-theme="dark"] .page-title, [data-theme="dark"] .about-section h2 { color: var(--text-color); }
    [data-theme="dark"] .about-section h2 { border-bottom-color: #374151; }
    [data-theme="dark"] .about-section p { color: var(--text-color); }
    [data-theme="dark"] .team-card { background: #1f2937; border-color: #374151; }
    [data-theme="dark"] .team-photo { border-color: #374151; }
    [data-theme="dark"] .team-photo-placeholder { background: #374151; color: #9ca3af; }
    [data-theme="dark"] .team-name { color: var(--text-color); }
    [data-theme="dark"] .team-research { color: var(--text-color); }
    [data-theme="dark"] .team-role, [data-theme="dark"] .team-empty-note { color: #888; }

<body>
  <div id="site-nav"></div>

  <main id="main-content" class="about-page page-shell">
    <h1 class="page-title">团队</h1>

    <div class="about-section">
      <h2>研究团队</h2>
      <p>
        蔺庆海老师现为山东交通学院交通与物流工程学院副教授、硕士生导师、智慧交通系副主任，
        依托智能交通系统与车路协同方向开展研究工作。团队长期面向智能交通系统、交通控制与仿真、
        智能网联与车路协同、交通大数据分析等领域，欢迎对智能交通与车路协同感兴趣的本科生、硕士研究生加入。
      </p>
    </div>

    <div class="about-section">
      <h2>团队成员</h2>

        <a href="mailto:linqinghai@sdjtu.edu.cn">linqinghai@sdjtu.edu.cn</a>。
      </p>
    </div>
